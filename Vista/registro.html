<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - ServiDom</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="registro.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="animate-fade-in-up">
    <div class="registro-container">
        <div class="registro-card">
            <div class="registro-header">
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span>ServiDom</span>
                </div>
                <h1>Crear Cuenta</h1>
                <p>Selecciona el tipo de cuenta y completa el formulario</p>
            </div>
            
            <!-- Formulario de Registro Unificado -->
            <form id="formRegistro" class="registro-form active">
                <div class="form-row">
                    <div class="form-group">
                        <input type="text" id="registro-nombre" placeholder="Nombre" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="registro-apellido" placeholder="Apellido" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <input type="text" id="registro-dni" placeholder="DNI (8 dígitos)" maxlength="8" required>
                    </div>
                    <div class="form-group">
                        <input type="tel" id="registro-telefono" placeholder="Teléfono (9 dígitos)" maxlength="9" required>
                    </div>
                </div>

                <div class="form-group">
                    <input type="email" id="registro-email" placeholder="Email" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <input type="password" id="registro-password" placeholder="Contraseña" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="registro-confirmar" placeholder="Confirmar Contraseña" required>
                    </div>
                </div>

                <div id="errorRegistro" class="error-container"></div>
                <button type="submit" class="btn-submit">Crear Cuenta</button>
            </form>
            
            <div class="registro-footer">
                <p>¿Ya tienes cuenta? <a href="login.html">Inicia Sesión</a></p>
                <a href="catalogo.html" class="back-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Volver al catálogo
                </a>
            </div>
        </div>
    </div>
    <script type="module" src="../Controlador/registro.js?v=3"></script>

    <script type="module" src="../Controlador/auth-state.js?v=3"></script>
</body>
</html>
