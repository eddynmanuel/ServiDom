<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar Anuncios - ServiDom</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="explorar.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="animate-fade-in-up">
    <!-- Header con navegación unificada -->
    <header class="main-header">
        <div class="header-left">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>ServiDom</span>
            </div>
            
            <!-- Navegación Principal -->
            <nav class="main-nav">
                <a href="catalogo.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span>Inicio</span>
                </a>
                <a href="chat.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span>Mensajes</span>
                </a>
                <a href="explorar.html" class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                    <span>Explorar</span>
                </a>
            </nav>
        </div>
        
        <div class="header-actions">
            <!-- auth-state.js inyectará dinámicamente aquí el perfil o los botones de login -->
        </div>
    </header>

    <main class="explorar-layout">
        <!-- Sidebar de Filtros -->
        <aside class="filtros-sidebar">
            <div class="sidebar-header">
                <h2>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                    </svg>
                    Filtros
                </h2>
                <button class="btn-limpiar" onclick="limpiarFiltros()">Limpiar</button>
            </div>
            
            <!-- Búsqueda -->
            <div class="filtro-group">
                <label>Buscar anuncio</label>
                <div class="search-input">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="buscar-anuncio" placeholder="Ej: plomería, electricidad...">
                </div>
            </div>
            
            <!-- Categoría -->
            <div class="filtro-group">
                <label>Categoría</label>
                <select id="filtro-categoria">
                    <option value="">Todas las categorías</option>
                    <option value="plomeria">🔧 Plomería</option>
                    <option value="electricidad">⚡ Electricidad</option>
                    <option value="limpieza">🧹 Limpieza</option>
                    <option value="pintura">🎨 Pintura</option>
                    <option value="jardineria">🌱 Jardinería</option>
                    <option value="electrodomesticos">📺 Electrodomésticos</option>
                    <option value="carpinteria">🪚 Carpintería</option>
                    <option value="otros">📦 Otros</option>
                </select>
            </div>
            
            <!-- Ubicación -->
            <div class="filtro-group">
                <label>Ubicación</label>
                <select id="filtro-ubicacion">
                    <option value="">Todas las ubicaciones</option>
                    <option value="bogota">Bogotá</option>
                    <option value="medellin">Medellín</option>
                    <option value="cali">Cali</option>
                    <option value="barranquilla">Barranquilla</option>
                    <option value="cartagena">Cartagena</option>
                </select>
            </div>
            
            <!-- Rango de precio -->
            <div class="filtro-group">
                <label>Rango de precio</label>
                <div class="precio-range">
                    <input type="number" id="precio-min" placeholder="Mín">
                    <span>-</span>
                    <input type="number" id="precio-max" placeholder="Máx">
                </div>
            </div>
            
            <!-- Urgencia -->
            <div class="filtro-group">
                <label>Urgencia</label>
                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" id="urgente" value="urgente">
                        <span class="checkmark"></span>
                        <span class="urgente-badge">🔥 Urgente</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="flexible" value="flexible">
                        <span class="checkmark"></span>
                        <span>Flexible</span>
                    </label>
                </div>
            </div>
            
            <!-- Ordenar por -->
            <div class="filtro-group">
                <label>Ordenar por</label>
                <select id="ordenar-por">
                    <option value="reciente">Más recientes</option>
                    <option value="precio-asc">Menor precio</option>
                    <option value="precio-desc">Mayor precio</option>
                    <option value="cercanos">Más cercanos</option>
                </select>
            </div>
            
            <button class="btn-aplicar" onclick="aplicarFiltros()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                Aplicar Filtros
            </button>
        </aside>

        <!-- Área de Anuncios -->
        <section class="anuncios-area">
            <div class="anuncios-header">
                <div class="header-info">
                    <h1>Anuncios Disponibles</h1>
                    <p id="total-anuncios">Cargando anuncios...</p>
                </div>
                <div class="view-actions" style="display: flex; gap: 16px; align-items: center;">
                    <button class="btn-publicar" onclick="abrirModalPublicar()" style="background: var(--primary); color: white; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; display: flex; align-items: center; gap: 8px;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 18px; height: 18px;">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Publicar Anuncio
                    </button>
                    <div class="view-toggle">
                        <button class="view-btn active" data-view="grid" title="Vista cuadrícula">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                    </button>
                    <button class="view-btn" data-view="list" title="Vista lista">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="8" y1="6" x2="21" y2="6"></line>
                            <line x1="8" y1="12" x2="21" y2="12"></line>
                            <line x1="8" y1="18" x2="21" y2="18"></line>
                            <line x1="3" y1="6" x2="3.01" y2="6"></line>
                            <line x1="3" y1="12" x2="3.01" y2="12"></line>
                            <line x1="3" y1="18" x2="3.01" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- Grid de anuncios -->
            <div class="anuncios-grid" id="anuncios-grid">
                <!-- Se cargan dinámicamente -->
            </div>
            
            <!-- Estado vacío -->
            <div class="empty-state" id="empty-state" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <h3>No se encontraron anuncios</h3>
                <p>Intenta ajustar los filtros de búsqueda</p>
            </div>
        </section>
    </main>

    <!-- Modal de detalle de anuncio -->
    <div class="modal" id="modal-detalle" style="display: none;">
        <div class="modal-content">
            <button class="btn-cerrar-modal" onclick="cerrarModal()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div id="modal-body">
                <!-- Contenido del anuncio -->
            </div>
        </div>
    </div>

    <!-- Modal para publicar anuncio -->
    <div class="modal" id="modal-publicar" style="display: none;">
        <div class="modal-content publish-modal">
            <button class="btn-cerrar-modal" onclick="cerrarModalPublicar()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <h2 class="modal-title">Publicar Nuevo Trabajo</h2>
            <form id="form-publicar" onsubmit="publicarNuevoAnuncio(event)" class="publish-form">
                <div class="form-group">
                    <label>Título del trabajo</label>
                    <input type="text" id="pub-titulo" required placeholder="Ej: Reparación de lavadora urgente">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Categoría</label>
                        <div class="select-wrapper">
                            <select id="pub-categoria" required>
                                <option value="" disabled selected>Selecciona una categoría</option>
                                <option value="plomeria">Plomería</option>
                                <option value="electricidad">Electricidad</option>
                                <option value="limpieza">Limpieza</option>
                                <option value="pintura">Pintura</option>
                                <option value="jardineria">Jardinería</option>
                                <option value="electrodomesticos">Electrodomésticos</option>
                                <option value="carpinteria">Carpintería</option>
                                <option value="otros">Otros</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Ubicación</label>
                        <input type="text" id="pub-ubicacion" required placeholder="Ej: Bogotá Sur">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Presupuesto estimado</label>
                        <input type="text" id="pub-precio" required placeholder="Ej: $50.000 - $80.000">
                    </div>
                    <div class="form-group checkbox-group-publish">
                        <label class="checkbox-item">
                            <input type="checkbox" id="pub-urgente">
                            <span class="checkmark"></span>
                            <span class="urgente-badge">🔥 Marcar como Urgente</span>
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Descripción detallada</label>
                    <textarea id="pub-descripcion" required rows="4" placeholder="Describe qué necesitas exactamente..."></textarea>
                </div>
                
                <button type="submit" class="btn-submit-publish">Publicar Trabajo</button>
            </form>
        </div>
    </div>

    <script src="../Controlador/tema-global.js"></script>
    <script src="../Controlador/explorar.js"></script>

    <script type="module" src="../Controlador/auth-state.js"></script>
</body>
</html>
